

services:
  db:
    image: postgres:15-alpine
    container_name: kitchen-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitchen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen_password}
      POSTGRES_DB: ${POSTGRES_DB:-kitchen_app}
    ports:
      - "5432:5432"
    volumes:
      - kitchen_db_data:/var/lib/postgresql/data
      
  webapp:
    build: .
    container_name: kitchen-webapp
    restart: always
    labels:
      - "diun.enable=false"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://kitchen_user:kitchen_password@db:5432/kitchen_app?schema=public}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_please_change_in_production}
    depends_on:
      - db
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  kitchen_db_data:
